<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marudhar Vault Ledger</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f2f5f9;--card:#fff;--tx:#16202e;--mu:#66758a;--bd:#e3e8ef;--pri:#1f7a50;--ok:#1b9a52;--okb:#e0f5e8;--due:#c97d00;--dueb:#fff1d6;--od:#d64545;--odb:#fde3e3;--vac:#8a97a8;--vacb:#edf0f4;--sh:0 2px 12px rgba(20,35,60,.07);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f151c;--card:#19222d;--tx:#eaf0f6;--mu:#94a3b5;--bd:#2a3644;--pri:#3fbf86;--ok:#5fd48e;--okb:#16352378;--due:#ffbf4d;--dueb:#47340f;--od:#ff8d8d;--odb:#4a1f1f;--vac:#94a3b5;--vacb:#243040;--sh:none;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.45 system-ui,-apple-system,"Segoe UI","Noto Sans",Arial,sans-serif}
header{background:linear-gradient(100deg,#2d3a5e,#1f7a50);color:#fff;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}.lgb{background:#fff;border-radius:14px;padding:5px;display:flex}.lg{height:44px;width:auto;display:block}
h1{margin:0;font-size:23px;line-height:1.1}.sub{font-size:13px;opacity:.85}
.hr,#me{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:15px}
.hb{font:inherit;font-weight:600;font-size:15px;padding:8px 14px;border-radius:999px;border:1.5px solid rgba(255,255,255,.7);background:rgba(255,255,255,.12);color:#fff;cursor:pointer}
main{max-width:1240px;margin:0 auto;padding:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px 16px;cursor:pointer;text-align:left;font:inherit;color:inherit;box-shadow:var(--sh);transition:transform .12s}
.kpi:hover{transform:translateY(-2px)}.kpi i{font-style:normal;font-size:22px}.kpi b{display:block;font-size:34px;line-height:1.1;margin-top:4px}.kpi span{color:var(--mu);font-size:15px}
.kpi.ok b{color:var(--ok)}.kpi.due b{color:var(--due)}.kpi.od b{color:var(--od)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0 12px}.bar input{flex:1;min-width:230px;width:auto}.bar select{width:auto;min-width:150px}
input,select,textarea{font:inherit;padding:12px 14px;border:1.5px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);width:100%}
input:focus,select:focus{outline:3px solid color-mix(in srgb,var(--pri) 30%,transparent);border-color:var(--pri)}
input[type=file]{padding:9px;font-size:15px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{font:inherit;font-weight:600;font-size:15px;padding:9px 16px;border-radius:999px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
.tab.on{background:var(--pri);border-color:var(--pri);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.c{--sc:var(--vac);background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px 16px 16px 20px;box-shadow:var(--sh);cursor:pointer;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px;min-height:178px}
.c::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--sc)}
.c.s-ok{--sc:var(--ok)}.c.s-due{--sc:var(--due)}.c.s-od{--sc:var(--od)}
.top{display:flex;justify-content:space-between;align-items:center}.no{font-size:20px}
.sz{font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--vacb);color:var(--mu)}
.who{display:flex;gap:10px;align-items:center}.av{width:42px;height:42px;border-radius:50%;background:var(--okb);color:var(--ok);display:grid;place-items:center;font-weight:800;flex:none}
.nm{font-size:20px;font-weight:700;line-height:1.2;word-break:break-word}.mu{color:var(--mu);font-size:15px}
.pill{display:inline-block;padding:3px 12px;border-radius:999px;font-size:14px;font-weight:700}
.pill.ok{background:var(--okb);color:var(--ok)}.pill.due{background:var(--dueb);color:var(--due)}.pill.od{background:var(--odb);color:var(--od)}
.kb{margin-top:auto;font:inherit;font-weight:700;font-size:16px;padding:11px;border-radius:12px;border:1.5px solid var(--pri);cursor:pointer;background:transparent;color:var(--pri)}
.kb.has{background:var(--pri);color:#fff}
.ov{position:fixed;inset:0;background:rgba(10,18,30,.55);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:16px;z-index:50}.ov.show{display:flex}
.md{background:var(--card);border-radius:24px;max-width:700px;width:100%;padding:22px;margin:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.md h2{margin:0;font-size:25px}.md h3{margin:0 0 6px;font-size:18px}
.mh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media (max-width:560px){.g2{grid-template-columns:1fr}}
label{display:block;font-weight:600;font-size:15px;margin:12px 0 5px}
.sec{margin:18px 0 2px;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--pri)}
.btn{font:inherit;font-weight:700;font-size:18px;padding:14px 24px;border:0;border-radius:14px;background:linear-gradient(100deg,#25805a,#1f6b52);color:#fff;cursor:pointer}
.btn.g{background:var(--vacb);color:var(--tx)}
.acts{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.hb2{font:inherit;font-weight:700;font-size:15px;padding:9px 14px;border-radius:10px;border:1.5px solid var(--pri);background:transparent;color:var(--pri);cursor:pointer}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.info div{background:var(--bg);border-radius:12px;padding:10px 12px}.info span{display:block;color:var(--mu);font-size:13px}.info b{font-size:17px}
.box{border:1px solid var(--bd);border-radius:16px;padding:14px;margin-top:14px}
.ln{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--bd)}.ln.t{font-weight:800;font-size:19px;border:0;padding-top:10px}
.note{background:var(--okb);color:var(--ok);border-radius:12px;padding:10px 14px;font-weight:700;margin-top:12px}
.fs{color:var(--ok);font-size:14px;margin-top:3px}
.hi{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 0;border-top:1px solid var(--bd)}
.err{color:var(--od);font-weight:600;margin-top:8px}
#login{position:fixed;inset:0;background:linear-gradient(160deg,var(--bg),var(--okb));z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1b9a52;color:#fff;padding:14px 24px;border-radius:14px;font-weight:700;display:none;z-index:99}
table{width:100%;border-collapse:collapse;font-size:15px}th{text-align:left;color:var(--mu)}td,th{padding:6px 8px 6px 0}tr+tr td{border-top:1px solid var(--bd)}

header{background:var(--card);color:var(--tx);border-bottom:1px solid var(--bd)}
.sub{color:var(--mu);opacity:1}.lgb{padding:0;border-radius:10px}
.hb{background:transparent;border:1px solid var(--bd);color:var(--tx)}
.btn{background:#1f7a50;box-shadow:none}.btn.g{background:var(--vacb);color:var(--tx)}
.tab.on{background:var(--tx);border-color:var(--tx);color:var(--bg)}
.c{box-shadow:none}.c:hover{border-color:var(--pri)}
.c.s-v{background:transparent;border:1.5px dashed var(--bd)}
.sz{background:var(--vacb);color:var(--mu)}
.kb.has{background:#1f7a50;border-color:#1f7a50;color:#fff}
.md{box-shadow:0 10px 40px rgba(0,0,0,.2)}
.kpi{box-shadow:none}.kpi:hover{transform:none;border-color:var(--pri)}
#login{background:var(--bg)}
</style></head><body>
<header><div class="brand"><span class="lgb"><img class="lg" alt="Marudhar" width="44" height="44"></span><div><h1>Vault Ledger</h1><div class="sub">Marudhar Safe &amp; Secure Pvt. Ltd.</div></div></div><div class="hr"><span id="today"></span><span id="me"></span></div></header>
<main id="app" style="display:none">
<div class="kpis" id="kpis"></div>
<div class="bar"><input id="q" type="search" placeholder="🔍 Search locker no., name, phone or key no."><select id="fs"><option value="">All Sizes</option><option>A</option><option>B</option><option>B1</option><option>C</option><option>D</option><option>D1</option><option>E</option><option>F</option><option>F1</option><option>G1</option><option>G2</option></select></div>
<div class="tabs" id="tabs"></div>
<div class="grid" id="grid"></div>
</main>
<div id="login"><div class="md" style="max-width:420px"><img id="lgf" alt="Marudhar Safe &amp; Secure Pvt. Ltd." style="display:block;margin:0 auto 6px;width:230px;max-width:80%;height:auto"><h2 style="text-align:center">Vault Ledger</h2><div class="mu" style="text-align:center">Please sign in</div><label for="le">Email</label><input id="le" type="email" autocomplete="username"><label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password"><div id="lerr" class="err"></div><div class="acts"><button class="btn" id="lb" style="width:100%">Sign in</button></div><div class="mu" style="margin-top:14px">Demo admin: admin@vault.com / admin123</div></div></div>
<div class="ov" id="ov"><div class="md" id="md"></div></div>
<div class="toast" id="toast"></div>
